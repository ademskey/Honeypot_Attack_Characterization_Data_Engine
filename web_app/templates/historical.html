<!DOCTYPE html>
<html>

<head>
    <title>Honeypot Data</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/honeypot.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="{{ url_for('static', filename='loadData.js') }}"></script>
    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <script src="{{ url_for('static', filename='historicalCharts.js') }}"></script>
</head>

<body>
    <h1>Honeypot Data Overview<br><span class="subtitle">Historical Data</span></h1>

    <div style="display: flex; justify-content: center; gap: 1px; margin-top: 20px;">
        <button onclick="location.href='hourly.html'">Hourly Data</button>
        <button onclick="location.href='home.html'">Home</button>
    </div>

    <div class="chart-container">
        <div class="box">
            <h2>
                <p id="historical-chart1-title"></p>
            </h2>
            <canvas id="historical-chart1"></canvas>
        </div>
        <div class="box">
            <h2>
                <p id="historical-chart2-title"></p>
            </h2>
            <canvas id="historical-chart2"></canvas>
        </div>
        <div class="box">
            <h2>
                <p id="historical-chart3-title"></p>
            </h2>
            <canvas id="historical-chart3"></canvas>
        </div>
        <div class="big-box">
            <h2>
                <p id="historical-chart4-title"></p>
            </h2>
            <canvas id="historical-chart4"></canvas>
        </div>

        <div class="big-box">
            <img src="../static/assets/data/ports_vs_time.png">
        </div>
    </div>


    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <script>
        window.addEventListener('scroll', function () {
            const footer = document.querySelector('footer');
            const scrollBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight;

            if (scrollBottom && !footer.classList.contains('visible')) {
                footer.classList.add('visible');
            }
        });
    </script>
</body>

<footer>
    <p>Data provided by the WWU Cyber Range T-Pot Team</p>
</footer>

</html>
