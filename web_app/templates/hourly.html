<!DOCTYPE html>
<html>

<head>
    <title>Honeypot Data</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='honeypot.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="{{ url_for('static', filename='loadData.js') }}"></script>
    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <script src="{{ url_for('static', filename='hourlyCharts.js') }}"></script>
</head>

<body>
    <h1>Honeypot Data Overview<br><span class="subtitle">Hourly Data</span></h1>

    <div style="display: flex; justify-content: center; gap: 1px; margin-top: 20px;">
        <button onclick="location.href='historical.html'">Historical Data</button>
        <button onclick="location.href='home.html'">Home</button>
    </div>

    <div class="chart-container">
        <div class="box">
            <h2>
                <p id="hourly-chart1-title"></p>
            </h2>
            <canvas id="hourly-chart1"></canvas>
        </div>
        <div class="box">
            <h2>
                <p id="hourly-chart2-title"></p>
            </h2>
            <canvas id="hourly-chart2"></canvas>
        </div>
        <div class="box">
            <h2>
                <p id="hourly-chart3-title"></p>
            </h2>
            <canvas id="hourly-chart3"></canvas>
        </div>
        <div class="big-box">
            <h2>
                <p id="hourly-chart4-title"></p>
            </h2>
            <canvas id="hourly-chart4"></canvas>
        </div>

    </div>

    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <script>
        window.addEventListener('scroll', function () {
            const footer = document.querySelector('footer');
            const scrollBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight;

            if (scrollBottom && !footer.classList.contains('visible')) {
                footer.classList.add('visible');
            }
        });
    </script>
</body>

<footer>
    <p>Data provided by the WWU Cyber Range T-Pot Team</p>
</footer>

</html>
